services:
  bar-replay:
    build: .
    image: bar-replay:latest
    container_name: bar-replay
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      FLASK_DEBUG: "0"
    volumes:
      - ./cache:/app/cache   # keep the 60s OHLCV cache between restarts
    restart: unless-stopped
